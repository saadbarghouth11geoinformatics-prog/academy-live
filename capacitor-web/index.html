<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0757c7" />
    <title>منصة عُبيدة</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: radial-gradient(circle at top right, #dff5ff, transparent 45%), #f4faff;
        color: #0b2945;
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(100%, 430px);
        border: 1px solid #d5e8f6;
        border-radius: 28px;
        background: #fff;
        padding: 30px;
        text-align: center;
        box-shadow: 0 25px 65px -40px #0757c7;
      }
      .logo {
        display: grid;
        width: 76px;
        height: 76px;
        margin: auto;
        place-items: center;
        border-radius: 24px;
        background: linear-gradient(135deg, #0ea5e9, #0757c7);
      }
      .logo img {
        width: 58px;
        height: 58px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #587187;
        line-height: 1.9;
      }
      .note {
        margin-top: 18px;
        border-radius: 14px;
        background: #eef8ff;
        padding: 12px;
        color: #17659b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="logo"><img src="icon.png" alt="" /></span>
      <h1>منصة عُبيدة</h1>
      <p>نسخة Android تحتاج إلى ربطها بعنوان المنصة المنشور قبل إخراج ملف APK.</p>
      <div class="note">اضبط CAPACITOR_SERVER_URL ثم شغّل npm run android:sync</div>
    </main>
  </body>
</html>
