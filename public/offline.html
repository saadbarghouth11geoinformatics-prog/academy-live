<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0757c7" />
  <title>منصة عُبيدة — لا يوجد اتصال</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#dff5ff,transparent 45%),#f4faff;color:#0b2945;font-family:Arial,sans-serif}.card{width:min(100%,420px);border:1px solid #d5e8f6;border-radius:28px;background:#ffffffeb;padding:30px;text-align:center;box-shadow:0 25px 65px -40px #0757c7}.logo{display:grid;width:76px;height:76px;margin:auto;place-items:center;border-radius:24px;background:linear-gradient(135deg,#0ea5e9,#0757c7);color:white;font-size:34px}.logo img{width:48px;height:48px}h1{margin:20px 0 8px;font-size:24px}p{margin:0;color:#587187;line-height:1.9}button{width:100%;min-height:48px;margin-top:22px;border:0;border-radius:15px;background:#0757c7;color:white;font-size:16px;font-weight:800;cursor:pointer}
  </style>
</head>
<body><main class="card"><span class="logo"><img src="/favicon.svg" alt="" /></span><h1>الاتصال بالإنترنت غير متاح</h1><p>واجهة التطبيق مثبتة على جهازك، لكن بيانات الطلاب والمحاضرات والامتحانات تحتاج اتصالًا آمنًا بالمنصة.</p><button onclick="location.reload()">إعادة المحاولة</button></main></body>
</html>
